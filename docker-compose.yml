services:
  api:
    image: ${LIFE_IMAGE:-ghcr.io/zoomzoomtnt/lifeos-ai:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeos-api
    ports:
      - "${LIFE_API_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LIFE_DB: /data/life.db
      LIFE_API_PORT: "8787"
      LIFE_OPENCLAW_WAKE: ${LIFE_OPENCLAW_WAKE:-true}
      OPENCLAW_GATEWAY: ${OPENCLAW_GATEWAY:-http://host.docker.internal:18789}
      OPENCLAW_HOOK_TOKEN: ${OPENCLAW_HOOK_TOKEN:-}
      LIFE_WEIXIN_CHANNEL: ${LIFE_WEIXIN_CHANNEL:-openclaw-weixin}
      LIFE_PROACTIVE_MODEL: ${LIFE_PROACTIVE_MODEL:-}
      OPENCLAW_HOOKS_PATH: ${OPENCLAW_HOOKS_PATH:-/hooks}
      OPENCLAW_HOOK_NAME: ${OPENCLAW_HOOK_NAME:-life-os}
      LIFE_OPENCLAW_HOME: /openclaw
      LIFE_OPENCLAW_FILE_LOG: ${LIFE_OPENCLAW_FILE_LOG:-}
    volumes:
      - ${LIFE_DATA:-./data}:/data
      - ${OPENCLAW_HOME}:/openclaw:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 25s

  # One-shot: copy skill from this image into the host OpenClaw workspace.
  #   docker compose --profile sync run --rm skill-sync
  skill-sync:
    profiles: ["sync"]
    image: ${LIFE_IMAGE:-ghcr.io/zoomzoomtnt/lifeos-ai:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeos-skill-sync
    entrypoint: ["/app/sync-skill.sh"]
    environment:
      OPENCLAW_SYNC_ROOT: /openclaw
      LIFE_SKILL_SRC: /opt/life-os-skill
    volumes:
      - ${OPENCLAW_HOME}:/openclaw
    restart: "no"
