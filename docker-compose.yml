services:
  api:
    image: ${LIFE_IMAGE:-ghcr.io/zoomzoomtnt/lifeos-ai:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeos-api
    ports:
      # Loopback only by default: expose via the `proxy` profile (Caddy, HTTPS) below.
      # LIFE_API_BIND=0.0.0.0 publishes plain HTTP on all interfaces (not recommended: API keys
      # and session cookies would travel unencrypted, and passkeys need HTTPS anyway).
      - "${LIFE_API_BIND:-127.0.0.1}:${LIFE_API_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Turso (libSQL). Values come from the shell (CD passes them) or .env. No default URL on
      # purpose: if unset, the app refuses to start with a clear message instead of silently
      # using some database. Local SQLite instead: add docker-compose.local.yml.
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      LIFE_API_PORT: "8787"
      # Auth (docs/auth.md). LIFE_KEY_PEPPER: HMAC key for API key hashes, >= 32 chars, required in
      # production (the app refuses to start without it). Changing it invalidates every API key.
      LIFE_KEY_PEPPER: ${LIFE_KEY_PEPPER:-}
      # Public HTTPS host (Caddy) = passkey RP ID; owner login and approval links use it.
      LIFE_DOMAIN: ${LIFE_DOMAIN:-}
      LIFE_PUBLIC_URL: ${LIFE_PUBLIC_URL:-}
      LIFE_COOKIE_SECURE: ${LIFE_COOKIE_SECURE:-true}
      LIFE_AUTH_WRITES_PER_MINUTE: ${LIFE_AUTH_WRITES_PER_MINUTE:-60}
      LIFE_ACTUATOR_ENDPOINTS: ${LIFE_ACTUATOR_ENDPOINTS:-health,info,metrics,db}
      # Always false here: the app refuses to start with local-open=true outside the `local` profile.
      # docker-compose.local.yml turns it on (no credentials needed) for local development only.
      LIFE_AUTH_LOCAL_OPEN: "false"
      # OpenClaw master switch (false = REST API + DB only, no OpenClaw calls/ingest/cron wake)
      OPENCLAW_ENABLED: ${OPENCLAW_ENABLED:-true}
      LIFE_OPENCLAW_WAKE: ${LIFE_OPENCLAW_WAKE:-true}
      OPENCLAW_GATEWAY: ${OPENCLAW_GATEWAY:-http://host.docker.internal:18789}
      OPENCLAW_HOOK_TOKEN: ${OPENCLAW_HOOK_TOKEN:-}
      LIFE_WEIXIN_CHANNEL: ${LIFE_WEIXIN_CHANNEL:-openclaw-weixin}
      LIFE_PROACTIVE_MODEL: ${LIFE_PROACTIVE_MODEL:-}
      OPENCLAW_HOOKS_PATH: ${OPENCLAW_HOOKS_PATH:-/hooks}
      OPENCLAW_HOOK_NAME: ${OPENCLAW_HOOK_NAME:-life-os}
      LIFE_OPENCLAW_HOME: /openclaw
      LIFE_OPENCLAW_FILE_LOG: ${LIFE_OPENCLAW_FILE_LOG:-}
    volumes:
      # OPENCLAW_HOME may be unset when OpenClaw is off; an empty local dir is mounted instead.
      - ${OPENCLAW_HOME:-./openclaw-disabled}:/openclaw:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 25s

  # One-shot: copy skill from this image into the host OpenClaw workspace.
  #   docker compose --profile sync run --rm skill-sync
  skill-sync:
    profiles: ["sync"]
    image: ${LIFE_IMAGE:-ghcr.io/zoomzoomtnt/lifeos-ai:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeos-skill-sync
    entrypoint: ["/app/sync-skill.sh"]
    environment:
      OPENCLAW_SYNC_ROOT: /openclaw
      OPENCLAW_ENABLED: ${OPENCLAW_ENABLED:-true}
      LIFE_SKILL_SRC: /opt/life-os-skill
    volumes:
      - ${OPENCLAW_HOME:-./openclaw-disabled}:/openclaw
    restart: "no"

  # Optional HTTPS reverse proxy with automatic Let's Encrypt certificates.
  # Off unless started with the profile; CD enables it when the repo variable LIFE_DOMAIN is set.
  #   LIFE_DOMAIN=api.example.com docker compose --profile proxy up -d
  caddy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    container_name: lifeos-caddy
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      LIFE_DOMAIN: ${LIFE_DOMAIN:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
