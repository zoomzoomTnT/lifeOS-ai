# Local debug overlay. Does not replace docker-compose.yml.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# SQLite file: ./local/life.db  (local profile; production uses Turso)
# OpenClaw wake is off so you do not message production WeChat.
# Without OpenClaw at all: OPENCLAW_ENABLED=false docker compose -f docker-compose.yml -f docker-compose.local.yml up -d

services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: local
      LIFE_DB: /data/life.db
      LIFE_OPENCLAW_WAKE: "false"
      LIFE_OPENCLAW_HOME: /openclaw
      # Plain http://localhost: session cookie without Secure; dev pepper unless you set one.
      # LIFE_AUTH_LOCAL_OPEN=false to test real auth (CI does).
      LIFE_COOKIE_SECURE: "false"
      LIFE_KEY_PEPPER: ${LIFE_KEY_PEPPER:-local-dev-pepper-not-a-secret-000000}
      LIFE_PUBLIC_URL: ${LIFE_PUBLIC_URL:-http://localhost:8787}
    volumes:
      - ./local:/data
      - ${OPENCLAW_HOME:-${HOME}/.openclaw}:/openclaw:ro
