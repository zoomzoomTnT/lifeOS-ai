# Local debug: repo-relative SQLite file instead of Turso, do not ping WeChat.
#   cd app && mvn spring-boot:run -Dspring-boot.run.profiles=local
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Override path: LIFE_DB=/abs/path/life.db

spring:
  datasource:
    url: jdbc:sqlite:${LIFE_DB:${user.dir}/../local/life.db}
    driver-class-name: org.sqlite.JDBC
    password: ""
    hikari:
      connection-init-sql: "PRAGMA foreign_keys=ON; PRAGMA journal_mode=WAL;"

server:
  servlet:
    session:
      cookie:
        name: LIFEOS_SESSION                  # no __Host- prefix: that needs Secure, i.e. HTTPS
        secure: ${LIFE_COOKIE_SECURE:false}   # plain http://localhost

life:
  auth:
    # Dev-only pepper so `local` starts without secrets; LIFE_KEY_PEPPER still wins if set.
    pepper: ${LIFE_KEY_PEPPER:local-dev-pepper-not-a-secret-000000}
    # No credentials needed locally (requests without a key act as the owner). Set
    # LIFE_AUTH_LOCAL_OPEN=false to test real auth locally (CI does).
    local-open: ${LIFE_AUTH_LOCAL_OPEN:true}
    public-url: ${LIFE_PUBLIC_URL:http://localhost:8787}
  openclaw:
    enabled: false
    home: ${LIFE_OPENCLAW_HOME:${user.dir}/../local/openclaw-stub}

logging:
  level:
    com.lifeos: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

