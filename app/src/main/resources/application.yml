server:
  address: 0.0.0.0
  port: ${LIFE_API_PORT:8787}
  # Behind Caddy: trust X-Forwarded-For/Proto from internal proxies only (Tomcat RemoteIpValve), so
  # audit rows get the real client IP and links/cookies know the request was HTTPS.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        name: LIFEOS_SESSION
        http-only: true
        same-site: strict
        secure: ${LIFE_COOKIE_SECURE:true}   # sessions only over HTTPS (Caddy)

spring:
  application:
    name: life-os-app
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    open-in-view: false
    database-platform: com.lifeos.config.TursoSQLiteDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: com.lifeos.config.TursoSQLiteDialect
    show-sql: false
  # Turso (hosted libSQL) over HTTPS. There is deliberately NO default URL: production must set
  # TURSO_DATABASE_URL (e.g. jdbc:libsql:https://<db>-<org>.turso.io) and TURSO_AUTH_TOKEN explicitly
  # (never commit the token). Without them startup fails with a clear message (DatabaseSettingsCheck).
  # Local SQLite file: run with the `local` profile.
  datasource:
    url: ${TURSO_DATABASE_URL:}
    password: ${TURSO_AUTH_TOKEN:}
    driver-class-name: com.lifeos.db.libsql.LibSqlHttpDriver
    hikari:
      maximum-pool-size: 4
      # No connection-init-sql: a pooled connection is not one server-side connection (each
      # transaction / auto-commit statement is its own Hrana stream). The driver sends
      # PRAGMA foreign_keys=ON at the start of every stream instead.

# OpenClaw master switch. OPENCLAW_ENABLED=false turns off every OpenClaw integration (webhook
# client, proactive cron wake, webhook ping, OpenClaw log ingest). REST API + database keep working.
lifeos:
  openclaw:
    enabled: ${OPENCLAW_ENABLED:true}

life:
  owner-timezone: Asia/Tokyo
  auth:
    # HMAC key for API key hashes. Required (>= 32 chars) outside `local`; the app refuses to start
    # without it. Env only, never in the DB or the repo. Changing it invalidates every API key.
    pepper: ${LIFE_KEY_PEPPER:}
    local-open: false                       # only the `local` profile may turn this on
    writes-per-minute: ${LIFE_AUTH_WRITES_PER_MINUTE:60}
    domain: ${LIFE_DOMAIN:}                 # public HTTPS host = passkey RP ID
    public-url: ${LIFE_PUBLIC_URL:}         # default https://${LIFE_DOMAIN}
  schema-path: classpath:schema.sql   # or external path
  openclaw:
    enabled: ${LIFE_OPENCLAW_WAKE:true}   # cron wake only; ignored when OPENCLAW_ENABLED=false
    base-url: ${OPENCLAW_GATEWAY:http://localhost:18789}
    hook-token: ${OPENCLAW_HOOK_TOKEN:}
    hooks-path: ${OPENCLAW_HOOKS_PATH:/hooks}
    hook-name: ${OPENCLAW_HOOK_NAME:life-os}
    channel: ${LIFE_WEIXIN_CHANNEL:openclaw-weixin}
    model: ${LIFE_PROACTIVE_MODEL:}
    home: ${LIFE_OPENCLAW_HOME:}
    file-log: ${LIFE_OPENCLAW_FILE_LOG:}
  logs:
    ingest-ms: ${LIFE_LOG_INGEST_MS:120000}
  proactive:
    cron: "${LIFE_PROACTIVE_CRON:0 * * * * *}"   # every minute, SQL first
    lead-minutes: 10
    lock-minutes: 15

logging:
  level:
    com.lifeos: INFO

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        # Everything except health needs the owner or an ops:admin credential (agents never have it).
        # Diagnostic endpoints (loggers, mappings, threaddump, ...) are opt-in via LIFE_ACTUATOR_ENDPOINTS.
        include: ${LIFE_ACTUATOR_ENDPOINTS:health,info,metrics,db}
    # Writable operations (loggers POST, ...) are off: read-only, even if exposed.
    access:
      max-permitted: read-only
  endpoint:
    health:
      # status is public; components/details only for ops:admin
      show-details: when-authorized
      show-components: when-authorized
      roles: SCOPE_ops:admin
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: life-os-app
    version: 0.1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  show-actuator: true
  group-configs:
    - group: api
      paths-to-match: /api/**
    - group: actuator
      paths-to-match: /actuator/**
