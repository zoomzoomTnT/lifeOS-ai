server:
  address: 0.0.0.0
  port: ${LIFE_API_PORT:8787}

spring:
  application:
    name: life-os-app
  datasource:
    url: jdbc:sqlite:${LIFE_DB:${user.home}/.openclaw/workspace/data/life.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      connection-init-sql: "PRAGMA foreign_keys=ON; PRAGMA journal_mode=WAL;"

life:
  owner-timezone: Asia/Tokyo
  schema-path: classpath:schema.sql   # or external path
  openclaw:
    enabled: ${LIFE_OPENCLAW_WAKE:true}
    base-url: ${OPENCLAW_GATEWAY:http://127.0.0.1:18789}
    hook-token: ${OPENCLAW_HOOK_TOKEN:}
    channel: ${LIFE_WEIXIN_CHANNEL:openclaw-weixin}
    model: ${LIFE_PROACTIVE_MODEL:}
  proactive:
    cron: "${LIFE_PROACTIVE_CRON:0 * * * * *}"   # every minute, SQL first
    lead-minutes: 10
    lock-minutes: 15

logging:
  level:
    com.lifeos: INFO
