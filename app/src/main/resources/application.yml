server:
  address: 0.0.0.0
  port: ${LIFE_API_PORT:8787}

spring:
  application:
    name: life-os-app
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.community.dialect.SQLiteDialect
    show-sql: false
  datasource:
    url: jdbc:sqlite:${LIFE_DB:${user.home}/.openclaw/workspace/data/life.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      connection-init-sql: "PRAGMA foreign_keys=ON; PRAGMA journal_mode=WAL;"

life:
  owner-timezone: Asia/Tokyo
  schema-path: classpath:schema.sql   # or external path
  openclaw:
    enabled: ${LIFE_OPENCLAW_WAKE:true}
    base-url: ${OPENCLAW_GATEWAY:http://localhost:18789}
    hook-token: ${OPENCLAW_HOOK_TOKEN:}
    channel: ${LIFE_WEIXIN_CHANNEL:openclaw-weixin}
    model: ${LIFE_PROACTIVE_MODEL:}
    home: ${LIFE_OPENCLAW_HOME:}
    file-log: ${LIFE_OPENCLAW_FILE_LOG:}
  logs:
    ingest-ms: ${LIFE_LOG_INGEST_MS:120000}
  proactive:
    cron: "${LIFE_PROACTIVE_CRON:0 * * * * *}"   # every minute, SQL first
    lead-minutes: 10
    lock-minutes: 15

logging:
  level:
    com.lifeos: INFO

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: ${LIFE_ACTUATOR_ENDPOINTS:health,info,metrics,db,scheduledtasks,loggers,mappings,threaddump}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: life-os-app
    version: 0.1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  show-actuator: true
  group-configs:
    - group: api
      paths-to-match: /api/**
    - group: actuator
      paths-to-match: /actuator/**
