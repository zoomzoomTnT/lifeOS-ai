server:
  address: 0.0.0.0
  port: ${LIFE_API_PORT:8787}

spring:
  application:
    name: life-os-app
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    open-in-view: false
    database-platform: com.lifeos.config.TursoSQLiteDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: com.lifeos.config.TursoSQLiteDialect
    show-sql: false
  # Turso (hosted libSQL) over HTTPS. Set TURSO_DATABASE_URL / TURSO_AUTH_TOKEN in the
  # environment (never commit the token). Local SQLite file: run with the `local` profile.
  datasource:
    url: ${TURSO_DATABASE_URL:jdbc:dbeaver:libsql:https://lifeos-ai-zoomzoomtnt.aws-ap-northeast-1.turso.io}
    password: ${TURSO_AUTH_TOKEN}
    driver-class-name: com.dbeaver.jdbc.driver.libsql.LibSqlDriver
    hikari:
      maximum-pool-size: 4
      # No connection-init-sql here. Turso's legacy HTTP endpoint (used by the DBeaver libSQL
      # driver) rejects PRAGMA assignments ("interactive transactions are not supported for
      # legacy HTTP protocol"), and Hikari fails the whole pool on it. Turso already runs with
      # foreign_keys=1, and connection-scoped PRAGMAs would not persist across requests anyway.

# OpenClaw master switch. OPENCLAW_ENABLED=false turns off every OpenClaw integration (webhook
# client, proactive cron wake, webhook ping, OpenClaw log ingest). REST API + database keep working.
lifeos:
  openclaw:
    enabled: ${OPENCLAW_ENABLED:true}

life:
  # API key for /api/** and /actuator/** (except /actuator/health). Header: Authorization: Bearer <key>.
  # Required outside the `local` profile: the app refuses to start without it (>= 32 chars).
  api-key: ${LIFE_API_KEY:}
  owner-timezone: Asia/Tokyo
  schema-path: classpath:schema.sql   # or external path
  openclaw:
    enabled: ${LIFE_OPENCLAW_WAKE:true}   # cron wake only; ignored when OPENCLAW_ENABLED=false
    base-url: ${OPENCLAW_GATEWAY:http://localhost:18789}
    hook-token: ${OPENCLAW_HOOK_TOKEN:}
    hooks-path: ${OPENCLAW_HOOKS_PATH:/hooks}
    hook-name: ${OPENCLAW_HOOK_NAME:life-os}
    channel: ${LIFE_WEIXIN_CHANNEL:openclaw-weixin}
    model: ${LIFE_PROACTIVE_MODEL:}
    home: ${LIFE_OPENCLAW_HOME:}
    file-log: ${LIFE_OPENCLAW_FILE_LOG:}
  logs:
    ingest-ms: ${LIFE_LOG_INGEST_MS:120000}
  proactive:
    cron: "${LIFE_PROACTIVE_CRON:0 * * * * *}"   # every minute, SQL first
    lead-minutes: 10
    lock-minutes: 15

logging:
  level:
    com.lifeos: INFO

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: ${LIFE_ACTUATOR_ENDPOINTS:health,info,metrics,db,scheduledtasks,loggers,mappings,threaddump}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: life-os-app
    version: 0.1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  show-actuator: true
  group-configs:
    - group: api
      paths-to-match: /api/**
    - group: actuator
      paths-to-match: /actuator/**
