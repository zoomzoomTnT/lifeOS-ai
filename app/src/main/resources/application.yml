server:
  address: 0.0.0.0
  port: ${LIFE_API_PORT:8787}

spring:
  application:
    name: life-os-app
  datasource:
    url: jdbc:sqlite:${LIFE_DB:${user.home}/.openclaw/workspace/data/life.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      connection-init-sql: "PRAGMA foreign_keys=ON; PRAGMA journal_mode=WAL;"

life:
  owner-timezone: Asia/Tokyo
  schema-path: classpath:schema.sql   # or external path
  due-scan-ms: ${LIFE_DUE_SCAN_MS:900000}   # 15m, Java only, no LLM
  wake-webhook: ${LIFE_WAKE_WEBHOOK:}       # optional non-model hook

logging:
  level:
    com.lifeos: INFO
