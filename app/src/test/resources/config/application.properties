# Tests: a fixed, non-secret pepper so every Spring test context starts (production refuses to
# start without LIFE_KEY_PEPPER; AuthSettingsCheckTest covers that).
life.auth.pepper=test-pepper-not-a-secret-0123456789abcdef
# Tests opt in to the diagnostic db endpoint to cover its access rules (prod default: health,info,metrics;
# CI checks the rendered docker-compose.yml default).
management.endpoints.web.exposure.include=health,info,metrics,db
# The admin key's deploy secrets (key id + SHA-256 of the secret part), required outside `local`.
# The matching test-only key is com.lifeos.testsupport.TestAdminKey. Not a secret.
life.auth.admin-key-id=testadminkey
life.auth.admin-key-sha256=6c4a9df0cc77bcd6f47308eed3f89c5dfe91d036cc39193af39a9e68e56d99c9
