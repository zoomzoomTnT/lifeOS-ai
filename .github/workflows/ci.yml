name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema:
    name: Validate schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Canonical schema copies must match
        run: diff -u schema/schema.sql app/src/main/resources/schema.sql

      - name: Apply schema.sql to a fresh SQLite database
        run: sqlite3 /tmp/life-ci.db < schema/schema.sql

      - name: Required tables exist
        run: |
          sqlite3 /tmp/life-ci.db ".tables" | tr ' ' '\n' | grep -E '^(people|receipts|fridge_items|memos|holdings|http_requests|ai_calls|model_prices|settings|app_logs|ai_session_logs)$'
          sqlite3 /tmp/life-ci.db "SELECT handle, role FROM people WHERE id = 1;"
          sqlite3 /tmp/life-ci.db "SELECT COUNT(*) FROM model_prices;" | grep -v '^0$'
          sqlite3 /tmp/life-ci.db "SELECT name FROM sqlite_master WHERE type='view' AND name='v_ai_daily';"

      - name: Additive migration applies to an old database
        run: |
          sqlite3 /tmp/life-old.db "CREATE TABLE people (id INTEGER PRIMARY KEY, handle TEXT); INSERT INTO people VALUES (1,'owner');"
          sqlite3 /tmp/life-old.db < schema/migrations/0002_ops.sql
          sqlite3 /tmp/life-old.db < schema/migrations/0003_logs.sql
          sqlite3 /tmp/life-old.db "SELECT COUNT(*) FROM ai_session_logs; SELECT COUNT(*) FROM app_logs;"

  build:
    name: Maven test & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        working-directory: app
        run: mvn -B verify

      - name: Upload jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: life-os-app
          path: app/target/life-os-app.jar
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker build, compose smoke, GHCR
    runs-on: ubuntu-latest
    needs: [schema, build]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/zoomzoomtnt/lifeos-ai
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zoomzoomtnt/lifeos-ai
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            lifeos-ai:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose smoke test
        run: |
          set -euo pipefail
          export LIFE_IMAGE=lifeos-ai:ci
          export LIFE_OPENCLAW_WAKE=false
          mkdir -p data
          mkdir -p "$HOME/.openclaw/agents/main/sessions"
          printf '%s\n' \
            '{"type":"session","timestamp":"2026-08-26T00:00:00Z","id":"ci-sess"}' \
            '{"type":"message","timestamp":"2026-08-26T00:00:01Z","message":{"role":"user","content":[{"type":"text","text":"秘密对话"}]}}' \
            > "$HOME/.openclaw/agents/main/sessions/ci.jsonl"
          docker compose up -d --wait --wait-timeout 90
          curl -fsS http://127.0.0.1:8787/api/health
          echo
          curl -fsS http://127.0.0.1:8787/actuator/health | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:8787/actuator/health | grep -q '"life"'
          curl -fsS http://127.0.0.1:8787/actuator/info | grep -q life-os-app
          curl -fsS http://127.0.0.1:8787/ops/index.html | grep -q "Life OS ops"
          AI=$(curl -fsS -X POST http://127.0.0.1:8787/api/ops/ai \
            -H 'Content-Type: application/json' \
            -H 'X-Life-Handle: owner' \
            -H 'X-Request-Id: ci-smoke-1' \
            -d '{"provider":"xai","model":"grok-4","purpose":"heartbeat","source":"app","prompt_tokens":1000,"completion_tokens":0}')
          echo "$AI"
          echo "$AI" | grep -q '0.003000'
          SW=$(curl -fsS 'http://127.0.0.1:8787/api/ops/should-wake?lead_minutes=10')
          echo "$SW"
          echo "$SW" | grep -qi 'heartbeat_ok'
          RUN=$(curl -fsS -X POST http://127.0.0.1:8787/api/ops/proactive/run \
            -H 'Content-Type: application/json' -d '{}')
          echo "$RUN"
          echo "$RUN" | grep -qi 'skipped\|wake'
          curl -fsS -X POST http://127.0.0.1:8787/api/receipts/lookup \
            -H 'Content-Type: application/json' \
            -H 'X-Request-Id: ci-smoke-1' \
            -d '{"barcode":"nope","printed_at":"x"}' >/dev/null
          curl -fsS http://127.0.0.1:8787/api/ops/http?limit=10 | grep -q '/api/receipts/lookup'
          ING=$(curl -fsS -X POST http://127.0.0.1:8787/api/ops/logs/ingest)
          echo "$ING"
          echo "$ING" | grep -q 'session_rows'
          META=$(curl -fsS 'http://127.0.0.1:8787/api/ops/logs/sessions?limit=5')
          echo "$META"
          echo "$META" | grep -q 'openclaw_session'
          echo "$META" | grep -qv '秘密对话'
          docker compose --profile sync run --rm skill-sync
          grep -q 'name: life-os' "$HOME/.openclaw/workspace/skills/life-os/SKILL.md"
          test -f "$HOME/.openclaw/workspace/HEARTBEAT.md"
          docker compose down

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done
