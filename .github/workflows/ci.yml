name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema:
    name: Validate schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Canonical schema copies must match
        run: diff -u schema/schema.sql app/src/main/resources/schema.sql

      - name: Apply schema.sql to a fresh SQLite database
        run: sqlite3 /tmp/life-ci.db < schema/schema.sql

      - name: Required tables exist
        run: |
          sqlite3 /tmp/life-ci.db ".tables" | tr ' ' '\n' | grep -E '^(people|receipts|fridge_items|memos|holdings)$'
          sqlite3 /tmp/life-ci.db "SELECT handle, role FROM people WHERE id = 1;"

  build:
    name: Maven test & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        working-directory: app
        run: mvn -B verify

      - name: Upload jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: life-os-app
          path: app/target/life-os-app-*.jar
          if-no-files-found: error
          retention-days: 14
