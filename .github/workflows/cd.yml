name: CD

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (empty = sha-<shortsha> built in this run)"
        required: false
        default: ""
      skip_build:
        description: "Skip rebuild and deploy an existing GHCR tag (set image_tag)"
        required: false
        type: boolean
        default: false

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zoomzoomtnt/lifeos-ai

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_build != true }}
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
      version: ${{ steps.tags.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven verify
        working-directory: app
        run: mvn -B verify

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          REF='${{ github.ref_name }}'
          VERSION="${REF#release/}"
          if [ "$VERSION" = "$REF" ] || [ -z "$VERSION" ]; then
            VERSION=release
          fi
          echo "tag=sha-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.tags.outputs.short }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.source=https://github.com/zoomzoomTnT/lifeOS-ai
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH docker compose up
    runs-on: ubuntu-latest
    needs: [image]
    if: ${{ always() && (needs.image.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_build == true)) }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          LIFE_API_KEY: ${{ secrets.LIFE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${LIFE_API_KEY:-}" ]; then
            echo "::error title=LIFE_API_KEY secret missing::The API now requires an API key and will not start without one. Add the repository secret LIFE_API_KEY (Settings > Secrets and variables > Actions > New repository secret), value from: openssl rand -hex 32. Then re-run this workflow."
            exit 1
          fi
          if [ "${#LIFE_API_KEY}" -lt 32 ]; then
            echo "::error title=LIFE_API_KEY too short::LIFE_API_KEY must be at least 32 characters (the app refuses shorter keys). Regenerate with: openssl rand -hex 32"
            exit 1
          fi
          case "$LIFE_API_KEY" in
            *[!A-Za-z0-9._~+/=-]*)
              echo "::error title=LIFE_API_KEY has unsupported characters::Use only letters, digits and ._~+/=- (openssl rand -hex 32 is fine); it is written to the server .env."
              exit 1 ;;
          esac
          echo "LIFE_API_KEY secret present (${#LIFE_API_KEY} chars)"

      - name: Resolve image tag
        id: resolve
        run: |
          set -euo pipefail
          TAG='${{ inputs.image_tag }}'
          if [ -z "$TAG" ]; then
            TAG='${{ needs.image.outputs.tag }}'
          fi
          if [ -z "$TAG" ]; then
            TAG=latest
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${IMAGE}:${TAG}"

      - name: Copy compose + OpenClaw scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_UN }}
          key: ${{ secrets.SERVER_PK }}
          source: docker-compose.yml,docker/ensure-hook-token.sh,docker/openclaw-config.sh,docker/Caddyfile
          target: /tmp/lifeos-cd
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_UN }}
          key: ${{ secrets.SERVER_PK }}
          command_timeout: 15m
          envs: GHCR_USER,GHCR_TOKEN,IMAGE,DEPLOY_TAG,TURSO_DATABASE_URL,TURSO_AUTH_TOKEN,OPENCLAW_ENABLED,LIFE_API_KEY,LIFE_DOMAIN
          script: |
            set -euo pipefail
            DEPLOY_DIR="${DEPLOY_DIR:-$HOME/lifeos}"
            IMAGE="${IMAGE:-ghcr.io/zoomzoomtnt/lifeos-ai}"
            TAG="${DEPLOY_TAG}"
            export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            # Empty secret -> fall back to TURSO_* in $DEPLOY_DIR/.env
            [ -n "${TURSO_DATABASE_URL:-}" ] || unset TURSO_DATABASE_URL
            [ -n "${TURSO_AUTH_TOKEN:-}" ] || unset TURSO_AUTH_TOKEN

            # API key (GitHub secret LIFE_API_KEY). The app refuses to start without it.
            if [ -z "${LIFE_API_KEY:-}" ]; then
              echo "::error::LIFE_API_KEY did not reach the server. Add the repository secret LIFE_API_KEY (openssl rand -hex 32) and re-run CD." >&2
              exit 1
            fi
            echo "preflight: LIFE_API_KEY present (${#LIFE_API_KEY} chars)"

            # Preflight: fail loudly (a bare `command -v docker` under set -e exits 1 with no output).
            echo "preflight: host=$(hostname) user=$(id -un) groups=$(id -Gn)"
            if [ -r /etc/os-release ]; then ( . /etc/os-release; echo "preflight: os=${PRETTY_NAME:-unknown}" ); fi
            if ! command -v docker >/dev/null 2>&1; then
              echo "::error::docker not found on server (PATH=$PATH). Install Docker Engine + Compose V2 plugin (see docs/cd.md#server-prerequisites)." >&2
              exit 1
            fi
            echo "preflight: docker=$(command -v docker)"
            if ! docker compose version; then
              echo "::error::'docker compose' (Compose V2) not available on server. Install the docker-compose-plugin (see docs/cd.md#server-prerequisites)." >&2
              exit 1
            fi
            if ! docker info >/dev/null 2>&1; then
              echo "::error::docker daemon not reachable as $(id -un). Run: sudo systemctl enable --now docker && sudo usermod -aG docker $(id -un) (then reconnect)." >&2
              exit 1
            fi
            command -v curl >/dev/null 2>&1 || { echo "::error::curl not found on server (needed for health check)." >&2; exit 1; }

            mkdir -p "$DEPLOY_DIR/data/backups" "$DEPLOY_DIR/openclaw-disabled"
            cp /tmp/lifeos-cd/docker-compose.yml "$DEPLOY_DIR/compose.yaml"
            cp /tmp/lifeos-cd/docker/ensure-hook-token.sh "$DEPLOY_DIR/ensure-hook-token.sh"
            cp /tmp/lifeos-cd/docker/openclaw-config.sh "$DEPLOY_DIR/openclaw-config.sh"
            mkdir -p "$DEPLOY_DIR/docker"
            cp /tmp/lifeos-cd/docker/Caddyfile "$DEPLOY_DIR/docker/Caddyfile"
            chmod +x "$DEPLOY_DIR/ensure-hook-token.sh" "$DEPLOY_DIR/openclaw-config.sh"
            cd "$DEPLOY_DIR"

            # OpenClaw master switch: GitHub repo variable OPENCLAW_ENABLED (default true).
            # Saved into .env so the container (and manual deploy.sh runs) see the same value.
            OC="$(printf '%s' "${OPENCLAW_ENABLED:-true}" | tr '[:upper:]' '[:lower:]')"
            case "$OC" in false|0|no|off) OC=false ;; *) OC=true ;; esac
            export OPENCLAW_ENABLED="$OC"
            ( umask 077; touch .env )
            if grep -q '^OPENCLAW_ENABLED=' .env; then
              sed -i "s/^OPENCLAW_ENABLED=.*/OPENCLAW_ENABLED=$OC/" .env
            else
              echo "OPENCLAW_ENABLED=$OC" >> .env
            fi
            echo "OPENCLAW_ENABLED=$OC"

            # Upsert KEY=VALUE in .env (mode 600) without sed-escaping the value.
            upsert_env() {
              ( umask 077
                { grep -v "^$1=" .env || true; printf '%s=%s\n' "$1" "$2"; } > .env.tmp
                mv .env.tmp .env )
            }
            # API key from the GitHub secret; saved so manual deploy.sh runs use the same key.
            upsert_env LIFE_API_KEY "$LIFE_API_KEY"
            export LIFE_API_KEY
            echo "LIFE_API_KEY written to .env (value not shown)"

            # Optional HTTPS proxy: repo variable LIFE_DOMAIN (empty = keep whatever .env has).
            if [ -n "${LIFE_DOMAIN:-}" ]; then
              upsert_env LIFE_DOMAIN "$LIFE_DOMAIN"
            fi
            LIFE_DOMAIN="${LIFE_DOMAIN:-$(sed -n 's/^LIFE_DOMAIN=//p' .env | tail -n 1)}"
            export LIFE_DOMAIN
            PROFILES=""
            if [ -n "$LIFE_DOMAIN" ]; then
              PROFILES="--profile proxy"
              echo "LIFE_DOMAIN=$LIFE_DOMAIN: Caddy HTTPS proxy enabled (ports 80/443)"
            else
              echo "LIFE_DOMAIN unset: no HTTPS proxy; API listens on 127.0.0.1:8787 only (LIFE_API_BIND to override)"
            fi

            MINTED=0
            if [ "$OC" = "true" ]; then
              ENSURE_OUT="$(./ensure-hook-token.sh)"
              echo "$ENSURE_OUT"
              echo "$ENSURE_OUT" | grep -q '^MINTED=1$' && MINTED=1
              eval "$(echo "$ENSURE_OUT" | grep -E '^(OPENCLAW_HOME|OPENCLAW_STATE_DIR|OPENCLAW_CONFIG_PATH)=')"
              # .env OPENCLAW_HOME is the state dir for compose. CLI must not see it as Unix HOME.
              export OPENCLAW_STATE_DIR="${OPENCLAW_STATE_DIR:-$OPENCLAW_HOME}"
              export OPENCLAW_CONFIG_PATH="${OPENCLAW_CONFIG_PATH:-$OPENCLAW_STATE_DIR/openclaw.json}"
              unset OPENCLAW_HOME
            else
              echo "OpenClaw disabled: skipping hook token, OpenClaw config, skill sync"
            fi

            if [ -f data/life.db ]; then
              STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
              cp -a data/life.db "data/backups/life.db.${STAMP}"
              echo "backed up data/life.db -> data/backups/life.db.${STAMP}"
              ls -1t data/backups/life.db.* 2>/dev/null | tail -n +11 | xargs -r rm -f
            fi

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USER:-github}" --password-stdin
            fi

            export LIFE_IMAGE="${IMAGE}:${TAG}"
            echo "LIFE_IMAGE=$LIFE_IMAGE minted=$MINTED OPENCLAW_STATE_DIR=${OPENCLAW_STATE_DIR:-}"
            if [ "$OC" = "true" ]; then
              echo "openclaw config file=$(openclaw config file)"
              command -v openclaw >/dev/null
              openclaw config validate
            fi

            # shellcheck disable=SC2086
            docker compose -f compose.yaml $PROFILES pull || true
            if [ "$MINTED" = "1" ]; then
              docker compose -f compose.yaml $PROFILES up -d --no-build --force-recreate
            else
              docker compose -f compose.yaml $PROFILES up -d --no-build
            fi
            if [ "$OC" = "true" ]; then
              docker compose -f compose.yaml run --rm skill-sync
            fi

            ok=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8787/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
                ok=1
                break
              fi
              sleep 4
            done
            if [ "$ok" != "1" ]; then
              echo "::error::lifeos-api did not become healthy within 120s"
              docker compose -f compose.yaml ps || true
              docker compose -f compose.yaml logs --no-color --tail=200 api || docker logs --tail=200 lifeos-api || true
              exit 1
            fi
            AUTH_HDR="Authorization: Bearer $LIFE_API_KEY"
            code="$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8787/api/ops/summary?hours=1')"
            if [ "$code" != "401" ]; then
              echo "::error::API auth not enforced: unauthenticated /api/ops/summary returned $code (expected 401)"
              exit 1
            fi
            if ! curl -fsS -o /dev/null -H "$AUTH_HDR" 'http://127.0.0.1:8787/api/ops/summary?hours=1'; then
              echo "::error::API rejected LIFE_API_KEY from the GitHub secret"
              exit 1
            fi
            echo "auth: 401 without key, 200 with LIFE_API_KEY"
            curl -fsS -H "$AUTH_HDR" http://127.0.0.1:8787/actuator/info || true
            echo
            docker compose -f compose.yaml ps || true
            docker image inspect "$LIFE_IMAGE" --format 'deployed {{.RepoTags}} {{.Id}}' || true
            if [ "$OC" = "true" ]; then
              echo "waiting 60s for skills watcher after delete+recopy"
              sleep 60
              openclaw skills list
            fi
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/zoomzoomtnt/lifeos-ai
          DEPLOY_TAG: ${{ steps.resolve.outputs.tag }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          OPENCLAW_ENABLED: ${{ vars.OPENCLAW_ENABLED || 'true' }}
          LIFE_API_KEY: ${{ secrets.LIFE_API_KEY }}
          LIFE_DOMAIN: ${{ vars.LIFE_DOMAIN }}
