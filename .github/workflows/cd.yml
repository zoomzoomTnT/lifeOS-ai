name: CD

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (empty = sha-<shortsha> built in this run)"
        required: false
        default: ""
      skip_build:
        description: "Skip rebuild and deploy an existing GHCR tag (set image_tag)"
        required: false
        type: boolean
        default: false

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zoomzoomtnt/lifeos-ai

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_build != true }}
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
      version: ${{ steps.tags.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven verify
        working-directory: app
        run: mvn -B verify

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          REF='${{ github.ref_name }}'
          VERSION="${REF#release/}"
          if [ "$VERSION" = "$REF" ] || [ -z "$VERSION" ]; then
            VERSION=release
          fi
          echo "tag=sha-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.tags.outputs.short }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.source=https://github.com/zoomzoomTnT/lifeOS-ai
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH docker compose up
    runs-on: ubuntu-latest
    needs: [image]
    if: ${{ always() && (needs.image.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_build == true)) }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: resolve
        run: |
          set -euo pipefail
          TAG='${{ inputs.image_tag }}'
          if [ -z "$TAG" ]; then
            TAG='${{ needs.image.outputs.tag }}'
          fi
          if [ -z "$TAG" ]; then
            TAG=latest
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${IMAGE}:${TAG}"

      - name: Copy compose + OpenClaw scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_UN }}
          key: ${{ secrets.SERVER_PK }}
          source: docker-compose.yml,docker/ensure-hook-token.sh,docker/openclaw-config.sh,docker/Caddyfile
          target: /tmp/lifeos-cd
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_UN }}
          key: ${{ secrets.SERVER_PK }}
          command_timeout: 15m
          envs: GHCR_USER,GHCR_TOKEN,IMAGE,DEPLOY_TAG,TURSO_DATABASE_URL,TURSO_AUTH_TOKEN,OPENCLAW_ENABLED,LIFE_KEY_PEPPER,LIFE_ADMIN_KEY_ID,LIFE_ADMIN_KEY_SHA256,LIFE_DOMAIN,LIFE_ACME_EMAIL,EXPLICIT_IMAGE
          script: |
            set -euo pipefail
            DEPLOY_DIR="${DEPLOY_DIR:-$HOME/lifeos}"
            IMAGE="${IMAGE:-ghcr.io/zoomzoomtnt/lifeos-ai}"
            TAG="${DEPLOY_TAG}"
            export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            # Empty secret -> fall back to TURSO_* in $DEPLOY_DIR/.env
            [ -n "${TURSO_DATABASE_URL:-}" ] || unset TURSO_DATABASE_URL
            [ -n "${TURSO_AUTH_TOKEN:-}" ] || unset TURSO_AUTH_TOKEN
            [ -n "${LIFE_KEY_PEPPER:-}" ] || unset LIFE_KEY_PEPPER
            [ -n "${LIFE_ADMIN_KEY_ID:-}" ] || unset LIFE_ADMIN_KEY_ID
            [ -n "${LIFE_ADMIN_KEY_SHA256:-}" ] || unset LIFE_ADMIN_KEY_SHA256

            # Preflight: fail loudly (a bare `command -v docker` under set -e exits 1 with no output).
            echo "preflight: host=$(hostname) user=$(id -un) groups=$(id -Gn)"
            if [ -r /etc/os-release ]; then ( . /etc/os-release; echo "preflight: os=${PRETTY_NAME:-unknown}" ); fi
            if ! command -v docker >/dev/null 2>&1; then
              echo "::error::docker not found on server (PATH=$PATH). Install Docker Engine + Compose V2 plugin (see docs/cd.md#server-prerequisites)." >&2
              exit 1
            fi
            echo "preflight: docker=$(command -v docker)"
            if ! docker compose version; then
              echo "::error::'docker compose' (Compose V2) not available on server. Install the docker-compose-plugin (see docs/cd.md#server-prerequisites)." >&2
              exit 1
            fi
            if ! docker info >/dev/null 2>&1; then
              echo "::error::docker daemon not reachable as $(id -un). Run: sudo systemctl enable --now docker && sudo usermod -aG docker $(id -un) (then reconnect)." >&2
              exit 1
            fi
            command -v curl >/dev/null 2>&1 || { echo "::error::curl not found on server (needed for health check)." >&2; exit 1; }

            # Preflight: the app has no default database URL, so this deploy must get one
            # (repo variable/secret, else $DEPLOY_DIR/.env). Fails before anything changes.
            if [ -z "${TURSO_DATABASE_URL:-}" ] && ! grep -qE '^TURSO_DATABASE_URL=.+' "$DEPLOY_DIR/.env" 2>/dev/null; then
              echo "::error::TURSO_DATABASE_URL is not set: set repo variable TURSO_DATABASE_URL or put it in $DEPLOY_DIR/.env. Nothing on the host was changed."
              exit 1
            fi

            # Preflight: API auth (Spring Security) refuses to start without the key-hash pepper.
            # GitHub secret LIFE_KEY_PEPPER, else LIFE_KEY_PEPPER= in $DEPLOY_DIR/.env.
            PEPPER_LEN=0
            if [ -n "${LIFE_KEY_PEPPER:-}" ]; then
              PEPPER_LEN=${#LIFE_KEY_PEPPER}
            elif [ -r "$DEPLOY_DIR/.env" ]; then
              P="$(sed -n 's/^LIFE_KEY_PEPPER=//p' "$DEPLOY_DIR/.env" | tail -n 1)"; PEPPER_LEN=${#P}; unset P
            fi
            if [ "$PEPPER_LEN" -lt 32 ]; then
              echo "::error::LIFE_KEY_PEPPER is missing or shorter than 32 chars. zoomzoom: add the GitHub secret LIFE_KEY_PEPPER (generate with: openssl rand -base64 48) and re-run. See docs/auth.md#cutover. Nothing on the host was changed."
              exit 1
            fi
            echo "preflight: LIFE_KEY_PEPPER present (${PEPPER_LEN} chars)"

            # Preflight: the admin key (lifeOS Admin bot) as key id + SHA-256 of its secret. The app
            # refuses to start without them. GitHub secrets of the same names, else $DEPLOY_DIR/.env.
            envval() { [ -r "$DEPLOY_DIR/.env" ] || return 0; sed -n "s/^$1=//p" "$DEPLOY_DIR/.env" | tail -n 1; }
            ADMIN_ID="${LIFE_ADMIN_KEY_ID:-$(envval LIFE_ADMIN_KEY_ID)}"
            ADMIN_SHA="${LIFE_ADMIN_KEY_SHA256:-$(envval LIFE_ADMIN_KEY_SHA256)}"
            if ! printf '%s' "$ADMIN_ID" | grep -Eqx '[a-z2-7]{12}' || ! printf '%s' "$ADMIN_SHA" | grep -Eqx '[0-9a-f]{64}'; then
              echo "::error::LIFE_ADMIN_KEY_ID / LIFE_ADMIN_KEY_SHA256 missing or malformed. zoomzoom: add both GitHub secrets (the lifeOS Admin bot generates them; see docs/auth.md#admin-key) and re-run. Nothing on the host was changed."
              exit 1
            fi
            echo "preflight: admin key id ${ADMIN_ID}"
            unset ADMIN_SHA

            mkdir -p "$DEPLOY_DIR/data/backups" "$DEPLOY_DIR/openclaw-disabled" "$DEPLOY_DIR/docker"
            cp /tmp/lifeos-cd/docker-compose.yml "$DEPLOY_DIR/compose.yaml"
            cp /tmp/lifeos-cd/docker/Caddyfile "$DEPLOY_DIR/docker/Caddyfile"
            cp /tmp/lifeos-cd/docker/ensure-hook-token.sh "$DEPLOY_DIR/ensure-hook-token.sh"
            cp /tmp/lifeos-cd/docker/openclaw-config.sh "$DEPLOY_DIR/openclaw-config.sh"
            chmod +x "$DEPLOY_DIR/ensure-hook-token.sh" "$DEPLOY_DIR/openclaw-config.sh"
            cd "$DEPLOY_DIR"

            # OpenClaw master switch: GitHub repo variable OPENCLAW_ENABLED (default true).
            # Saved into .env so the container (and manual deploy.sh runs) see the same value.
            OC="$(printf '%s' "${OPENCLAW_ENABLED:-true}" | tr '[:upper:]' '[:lower:]')"
            case "$OC" in false|0|no|off) OC=false ;; *) OC=true ;; esac
            export OPENCLAW_ENABLED="$OC"
            ( umask 077; touch .env )
            if grep -q '^OPENCLAW_ENABLED=' .env; then
              sed -i "s/^OPENCLAW_ENABLED=.*/OPENCLAW_ENABLED=$OC/" .env
            else
              echo "OPENCLAW_ENABLED=$OC" >> .env
            fi
            echo "OPENCLAW_ENABLED=$OC"

            # Auth settings into .env (mode 600) so restarts and manual deploys see the same values.
            # Written with awk, never echoed.
            upsert_env() {
              local k="$1" v="$2" tmp
              tmp="$(mktemp "$DEPLOY_DIR/.env.XXXXXX")"
              awk -v k="$k" -v v="$v" 'BEGIN{d=0} $0 ~ "^"k"=" {print k"="v; d=1; next} {print} END{if(!d) print k"="v}' .env > "$tmp"
              chmod 600 "$tmp"; mv "$tmp" .env
            }
            if [ -n "${LIFE_KEY_PEPPER:-}" ]; then upsert_env LIFE_KEY_PEPPER "$LIFE_KEY_PEPPER"; fi
            if [ -n "${LIFE_ADMIN_KEY_ID:-}" ]; then upsert_env LIFE_ADMIN_KEY_ID "$LIFE_ADMIN_KEY_ID"; fi
            if [ -n "${LIFE_ADMIN_KEY_SHA256:-}" ]; then upsert_env LIFE_ADMIN_KEY_SHA256 "$LIFE_ADMIN_KEY_SHA256"; fi
            upsert_env LIFE_DOMAIN "${LIFE_DOMAIN:-}"
            upsert_env LIFE_ACME_EMAIL "${LIFE_ACME_EMAIL:-}"
            chmod 600 .env
            PROFILES=""
            if [ -n "${LIFE_DOMAIN:-}" ]; then
              PROFILES="--profile proxy"
              echo "LIFE_DOMAIN=${LIFE_DOMAIN}: Caddy HTTPS proxy on 80/443"
            else
              echo "LIFE_DOMAIN not set: no HTTPS proxy; API on 127.0.0.1:8787 only"
            fi

            MINTED=0
            if [ "$OC" = "true" ]; then
              ENSURE_OUT="$(./ensure-hook-token.sh)"
              echo "$ENSURE_OUT"
              echo "$ENSURE_OUT" | grep -q '^MINTED=1$' && MINTED=1
              eval "$(echo "$ENSURE_OUT" | grep -E '^(OPENCLAW_HOME|OPENCLAW_STATE_DIR|OPENCLAW_CONFIG_PATH)=')"
              # .env OPENCLAW_HOME is the state dir for compose. CLI must not see it as Unix HOME.
              export OPENCLAW_STATE_DIR="${OPENCLAW_STATE_DIR:-$OPENCLAW_HOME}"
              export OPENCLAW_CONFIG_PATH="${OPENCLAW_CONFIG_PATH:-$OPENCLAW_STATE_DIR/openclaw.json}"
              unset OPENCLAW_HOME
            else
              echo "OpenClaw disabled: skipping hook token, OpenClaw config, skill sync"
            fi

            if [ -f data/life.db ]; then
              STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
              cp -a data/life.db "data/backups/life.db.${STAMP}"
              echo "backed up data/life.db -> data/backups/life.db.${STAMP}"
              ls -1t data/backups/life.db.* 2>/dev/null | tail -n +11 | xargs -r rm -f
            fi

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USER:-github}" --password-stdin
            fi

            export LIFE_IMAGE="${IMAGE}:${TAG}"
            echo "LIFE_IMAGE=$LIFE_IMAGE minted=$MINTED OPENCLAW_STATE_DIR=${OPENCLAW_STATE_DIR:-}"
            if [ "$OC" = "true" ]; then
              echo "openclaw config file=$(openclaw config file)"
              command -v openclaw >/dev/null
              openclaw config validate
            fi

            if ! docker compose -f compose.yaml $PROFILES pull; then
              echo "::error::docker compose pull failed; not deploying"; exit 1
            fi
            # Fail closed: the image must be inspectable, and only an explicit rollback (manual run with
            # image_tag) may deploy a pre-auth image (no lifeos.auth=1 label, e.g. sha-e2e4938). That one
            # has NO API authentication: never behind the public proxy, never on a public bind.
            if ! AUTH_IMAGE="$(docker image inspect "$LIFE_IMAGE" --format '{{ index .Config.Labels "lifeos.auth" }}')"; then
              echo "::error::cannot inspect $LIFE_IMAGE (pull failed?); not deploying"; exit 1
            fi
            if [ "$AUTH_IMAGE" != "1" ]; then
              if [ "${EXPLICIT_IMAGE:-0}" != "1" ]; then
                echo "::error::$LIFE_IMAGE has no lifeos.auth=1 label and this is not an explicit rollback (workflow_dispatch with image_tag); not deploying"; exit 1
              fi
              echo "::warning::rollback to pre-auth image $LIFE_IMAGE: unauthenticated API. Caddy stays off and the API binds 127.0.0.1 only."
              PROFILES=""
              export LIFE_API_BIND=127.0.0.1
              docker compose -f compose.yaml --profile proxy rm -sf caddy || true
            fi
            if [ "$MINTED" = "1" ]; then
              docker compose -f compose.yaml $PROFILES up -d --no-build --force-recreate --remove-orphans
            else
              docker compose -f compose.yaml $PROFILES up -d --no-build --remove-orphans
            fi
            if [ "$OC" = "true" ]; then
              docker compose -f compose.yaml run --rm skill-sync
            fi
            # what is actually running must be what was checked above
            RUNNING="$(docker inspect lifeos-api --format '{{ index .Config.Labels "lifeos.auth" }}' 2>/dev/null || echo '?')"
            if [ "$RUNNING" != "$AUTH_IMAGE" ]; then
              echo "::error::lifeos-api runs an image with lifeos.auth='$RUNNING', expected '$AUTH_IMAGE'"; exit 1
            fi

            ok=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8787/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
                ok=1
                break
              fi
              sleep 4
            done
            if [ "$ok" != "1" ]; then
              echo "::error::lifeos-api did not become healthy within 120s"
              docker compose -f compose.yaml ps || true
              docker compose -f compose.yaml logs --no-color --tail=200 api || docker logs --tail=200 lifeos-api || true
              exit 1
            fi
            if [ "$AUTH_IMAGE" = "1" ]; then
              # Auth is on: data and admin endpoints refuse anonymous callers.
              for p in /api/ops/summary /actuator/info /actuator/db; do
                c="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8787$p")"
                if [ "$c" != "401" ]; then
                  echo "::error::$p answered $c without credentials (expected 401)"; exit 1
                fi
              done
              echo "auth check: anonymous /api and /actuator -> 401"
            fi
            if [ "$AUTH_IMAGE" = "1" ] && [ -n "${LIFE_DOMAIN:-}" ]; then
              # first certificate can take a minute; warn only
              for i in $(seq 1 12); do
                curl -fsS "https://${LIFE_DOMAIN}/actuator/health" >/dev/null 2>&1 && { echo "https://${LIFE_DOMAIN} OK"; break; }
                [ "$i" = 12 ] && echo "::warning::https://${LIFE_DOMAIN}/actuator/health not reachable yet (DNS, security group 80/443, or certificate still issuing)"
                sleep 5
              done
            fi
            docker compose -f compose.yaml ps || true
            docker image inspect "$LIFE_IMAGE" --format 'deployed {{.RepoTags}} {{.Id}}' || true
            if [ "$OC" = "true" ]; then
              echo "waiting 60s for skills watcher after delete+recopy"
              sleep 60
              openclaw skills list
            fi
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/zoomzoomtnt/lifeos-ai
          DEPLOY_TAG: ${{ steps.resolve.outputs.tag }}
          TURSO_DATABASE_URL: ${{ vars.TURSO_DATABASE_URL || secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          OPENCLAW_ENABLED: ${{ vars.OPENCLAW_ENABLED || 'true' }}
          LIFE_KEY_PEPPER: ${{ secrets.LIFE_KEY_PEPPER }}
          LIFE_ADMIN_KEY_ID: ${{ secrets.LIFE_ADMIN_KEY_ID }}
          LIFE_ADMIN_KEY_SHA256: ${{ secrets.LIFE_ADMIN_KEY_SHA256 }}
          LIFE_DOMAIN: ${{ vars.LIFE_DOMAIN }}
          LIFE_ACME_EMAIL: ${{ vars.LIFE_ACME_EMAIL }}
          # Only a manual run naming an image (rollback) may deploy a pre-auth image.
          EXPLICIT_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && '1' || '0' }}
