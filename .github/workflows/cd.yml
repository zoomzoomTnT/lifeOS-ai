name: CD

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (empty = sha-<shortsha> built in this run)"
        required: false
        default: ""
      skip_build:
        description: "Skip rebuild and deploy an existing GHCR tag (set image_tag)"
        required: false
        type: boolean
        default: false
      rotate_hook_token:
        description: "Mint a new OPENCLAW_HOOK_TOKEN and restart Gateway + API"
        required: false
        type: boolean
        default: false

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zoomzoomtnt/lifeos-ai

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_build != true }}
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
      version: ${{ steps.tags.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven verify
        working-directory: app
        run: mvn -B verify

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          REF='${{ github.ref_name }}'
          VERSION="${REF#release/}"
          if [ "$VERSION" = "$REF" ] || [ -z "$VERSION" ]; then
            VERSION=release
          fi
          echo "tag=sha-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.tags.outputs.short }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.source=https://github.com/zoomzoomTnT/lifeOS-ai
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH docker compose up
    runs-on: ubuntu-latest
    needs: [image]
    if: ${{ always() && (needs.image.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_build == true)) }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: resolve
        run: |
          set -euo pipefail
          TAG='${{ inputs.image_tag }}'
          if [ -z "$TAG" ]; then
            TAG='${{ needs.image.outputs.tag }}'
          fi
          if [ -z "$TAG" ]; then
            TAG=latest
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${IMAGE}:${TAG}"

      - name: Copy compose + provision script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_UN }}
          key: ${{ secrets.SERVER_PK }}
          source: docker-compose.yml,docker/provision-hook-token.sh
          target: /tmp/lifeos-cd
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_UN }}
          key: ${{ secrets.SERVER_PK }}
          command_timeout: 15m
          envs: GHCR_USER,GHCR_TOKEN,IMAGE,DEPLOY_TAG,ROTATE_HOOK
          script: |
            set -euo pipefail
            DEPLOY_DIR="${DEPLOY_DIR:-$HOME/lifeos}"
            IMAGE="${IMAGE:-ghcr.io/zoomzoomtnt/lifeos-ai}"
            TAG="${DEPLOY_TAG}"

            command -v docker >/dev/null
            docker compose version

            mkdir -p "$DEPLOY_DIR/data/backups"
            cp /tmp/lifeos-cd/docker-compose.yml "$DEPLOY_DIR/compose.yaml"
            cp /tmp/lifeos-cd/docker/provision-hook-token.sh "$DEPLOY_DIR/provision-hook-token.sh"
            chmod +x "$DEPLOY_DIR/provision-hook-token.sh"
            cd "$DEPLOY_DIR"

            if [ "${ROTATE_HOOK:-}" = "true" ]; then
              ./provision-hook-token.sh rotate
            else
              ./provision-hook-token.sh ensure
            fi

            if [ -f data/life.db ]; then
              STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
              cp -a data/life.db "data/backups/life.db.${STAMP}"
              echo "backed up data/life.db -> data/backups/life.db.${STAMP}"
              ls -1t data/backups/life.db.* 2>/dev/null | tail -n +11 | xargs -r rm -f
            fi

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USER:-github}" --password-stdin
            fi

            export LIFE_IMAGE="${IMAGE}:${TAG}"
            echo "LIFE_IMAGE=$LIFE_IMAGE"
            docker compose -f compose.yaml pull api
            if [ "${ROTATE_HOOK:-}" = "true" ]; then
              docker compose -f compose.yaml up -d --no-build --force-recreate --remove-orphans --wait --wait-timeout 120 api
            else
              docker compose -f compose.yaml up -d --no-build --remove-orphans --wait --wait-timeout 120
            fi
            docker compose -f compose.yaml --profile sync run --rm skill-sync

            curl -fsS http://127.0.0.1:8787/actuator/health | grep -q '"status":"UP"'
            curl -fsS http://127.0.0.1:8787/actuator/info || true
            docker compose -f compose.yaml ps
            docker image inspect "$LIFE_IMAGE" --format 'deployed {{.RepoTags}} {{.Id}}'
            command -v openclaw >/dev/null && openclaw skills list || true
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/zoomzoomtnt/lifeos-ai
          DEPLOY_TAG: ${{ steps.resolve.outputs.tag }}
          ROTATE_HOOK: ${{ inputs.rotate_hook_token }}
