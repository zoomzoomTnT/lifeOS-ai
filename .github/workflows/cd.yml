name: CD

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (empty = sha-<shortsha> built in this run)"
        required: false
        default: ""
      skip_build:
        description: "Skip rebuild and deploy an existing GHCR tag (set image_tag)"
        required: false
        type: boolean
        default: false

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zoomzoomtnt/lifeos-ai

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_build != true }}
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
      version: ${{ steps.tags.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven verify
        working-directory: app
        run: mvn -B verify

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          REF='${{ github.ref_name }}'
          VERSION="${REF#release/}"
          if [ "$VERSION" = "$REF" ] || [ -z "$VERSION" ]; then
            VERSION=release
          fi
          echo "tag=sha-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.tags.outputs.short }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.source=https://github.com/zoomzoomTnT/lifeOS-ai
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH docker compose up
    runs-on: ubuntu-latest
    needs: [image]
    if: ${{ always() && (needs.image.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_build == true)) }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: resolve
        run: |
          set -euo pipefail
          TAG='${{ inputs.image_tag }}'
          if [ -z "$TAG" ]; then
            TAG='${{ needs.image.outputs.tag }}'
          fi
          if [ -z "$TAG" ]; then
            TAG=latest
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${IMAGE}:${TAG}"

      - name: Copy compose + OpenClaw scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_UN }}
          key: ${{ secrets.SERVER_PK }}
          source: docker-compose.yml,docker/ensure-hook-token.sh,docker/openclaw-config.sh,docker/migrate-sqlite-to-turso.sh
          target: /tmp/lifeos-cd
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_UN }}
          key: ${{ secrets.SERVER_PK }}
          command_timeout: 15m
          envs: GHCR_USER,GHCR_TOKEN,IMAGE,DEPLOY_TAG,TURSO_DATABASE_URL,TURSO_AUTH_TOKEN,OPENCLAW_ENABLED
          script: |
            set -euo pipefail
            DEPLOY_DIR="${DEPLOY_DIR:-$HOME/lifeos}"
            IMAGE="${IMAGE:-ghcr.io/zoomzoomtnt/lifeos-ai}"
            TAG="${DEPLOY_TAG}"
            export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            # Empty variable/secret -> fall back to TURSO_* in $DEPLOY_DIR/.env
            [ -n "${TURSO_DATABASE_URL:-}" ] || unset TURSO_DATABASE_URL
            [ -n "${TURSO_AUTH_TOKEN:-}" ] || unset TURSO_AUTH_TOKEN

            # Preflight: fail loudly (a bare `command -v docker` under set -e exits 1 with no output).
            echo "preflight: host=$(hostname) user=$(id -un) groups=$(id -Gn)"
            if [ -r /etc/os-release ]; then ( . /etc/os-release; echo "preflight: os=${PRETTY_NAME:-unknown}" ); fi
            if ! command -v docker >/dev/null 2>&1; then
              echo "::error::docker not found on server (PATH=$PATH). Install Docker Engine + Compose V2 plugin (see docs/cd.md#server-prerequisites)." >&2
              exit 1
            fi
            echo "preflight: docker=$(command -v docker)"
            if ! docker compose version; then
              echo "::error::'docker compose' (Compose V2) not available on server. Install the docker-compose-plugin (see docs/cd.md#server-prerequisites)." >&2
              exit 1
            fi
            if ! docker info >/dev/null 2>&1; then
              echo "::error::docker daemon not reachable as $(id -un). Run: sudo systemctl enable --now docker && sudo usermod -aG docker $(id -un) (then reconnect)." >&2
              exit 1
            fi
            command -v curl >/dev/null 2>&1 || { echo "::error::curl not found on server (needed for health check)." >&2; exit 1; }

            # Preflight, before anything on the host changes: the app has NO default database URL
            # any more, so make sure this deploy gets one explicitly. Fails here (old container
            # keeps running) instead of after `compose up`.
            env_file_value() { [ -f "$DEPLOY_DIR/.env" ] && grep -E "^$1=" "$DEPLOY_DIR/.env" | tail -n 1 | cut -d= -f2- | sed -e 's/^["'\'']//' -e 's/["'\'']$//' || true; }
            EFFECTIVE_DB_URL="${TURSO_DATABASE_URL:-$(env_file_value TURSO_DATABASE_URL)}"
            EFFECTIVE_DB_TOKEN="${TURSO_AUTH_TOKEN:-$(env_file_value TURSO_AUTH_TOKEN)}"
            if [ -z "$EFFECTIVE_DB_URL" ]; then
              echo "::error::TURSO_DATABASE_URL is not set: add repo variable (or secret) TURSO_DATABASE_URL, or put it in $DEPLOY_DIR/.env"
              exit 1
            fi
            case "$EFFECTIVE_DB_URL" in
              *authToken=*) : ;;  # token embedded in the URL
              *https://*|*libsql://*)
                if [ -z "$EFFECTIVE_DB_TOKEN" ]; then
                  echo "::error::TURSO_AUTH_TOKEN is not set (secret or $DEPLOY_DIR/.env)"
                  exit 1
                fi ;;
            esac
            echo "database: $(echo "$EFFECTIVE_DB_URL" | sed 's/[?].*//')"

            mkdir -p "$DEPLOY_DIR/data/backups" "$DEPLOY_DIR/openclaw-disabled"
            cp /tmp/lifeos-cd/docker-compose.yml "$DEPLOY_DIR/compose.yaml"
            cp /tmp/lifeos-cd/docker/ensure-hook-token.sh "$DEPLOY_DIR/ensure-hook-token.sh"
            cp /tmp/lifeos-cd/docker/openclaw-config.sh "$DEPLOY_DIR/openclaw-config.sh"
            cp /tmp/lifeos-cd/docker/migrate-sqlite-to-turso.sh "$DEPLOY_DIR/migrate-sqlite-to-turso.sh"
            chmod +x "$DEPLOY_DIR/ensure-hook-token.sh" "$DEPLOY_DIR/openclaw-config.sh" "$DEPLOY_DIR/migrate-sqlite-to-turso.sh"
            cd "$DEPLOY_DIR"

            # OpenClaw master switch: GitHub repo variable OPENCLAW_ENABLED (default true).
            # Saved into .env so the container (and manual deploy.sh runs) see the same value.
            OC="$(printf '%s' "${OPENCLAW_ENABLED:-true}" | tr '[:upper:]' '[:lower:]')"
            case "$OC" in false|0|no|off) OC=false ;; *) OC=true ;; esac
            export OPENCLAW_ENABLED="$OC"
            ( umask 077; touch .env )
            if grep -q '^OPENCLAW_ENABLED=' .env; then
              sed -i "s/^OPENCLAW_ENABLED=.*/OPENCLAW_ENABLED=$OC/" .env
            else
              echo "OPENCLAW_ENABLED=$OC" >> .env
            fi
            echo "OPENCLAW_ENABLED=$OC"

            MINTED=0
            if [ "$OC" = "true" ]; then
              ENSURE_OUT="$(./ensure-hook-token.sh)"
              echo "$ENSURE_OUT"
              echo "$ENSURE_OUT" | grep -q '^MINTED=1$' && MINTED=1
              eval "$(echo "$ENSURE_OUT" | grep -E '^(OPENCLAW_HOME|OPENCLAW_STATE_DIR|OPENCLAW_CONFIG_PATH)=')"
              # .env OPENCLAW_HOME is the state dir for compose. CLI must not see it as Unix HOME.
              export OPENCLAW_STATE_DIR="${OPENCLAW_STATE_DIR:-$OPENCLAW_HOME}"
              export OPENCLAW_CONFIG_PATH="${OPENCLAW_CONFIG_PATH:-$OPENCLAW_STATE_DIR/openclaw.json}"
              unset OPENCLAW_HOME
            else
              echo "OpenClaw disabled: skipping hook token, OpenClaw config, skill sync"
            fi

            # data/life.db is the legacy (pre-Turso) SQLite database: the app no longer reads or
            # writes it, so per-deploy rotating copies are pointless. Keep it in place and take ONE
            # frozen snapshot (never rotated away) as migration source / rollback point. Live data
            # is in Turso, which has its own point-in-time restore. Migration is manual:
            # docker/migrate-sqlite-to-turso.sh (see docs/turso.md).
            # Consistent copy: sqlite3 .backup (online-safe) if available; otherwise stop the API
            # first (the old SQLite build may still be writing; `compose up` below starts the new one).
            if [ -f data/life.db ] && [ ! -f data/backups/life.db.pre-turso ]; then
              if command -v sqlite3 >/dev/null 2>&1; then
                sqlite3 data/life.db ".backup 'data/backups/life.db.pre-turso'"
              else
                docker compose -f compose.yaml stop api || true
                cp -a data/life.db data/backups/life.db.pre-turso
                for ext in -wal -shm; do
                  if [ -f "data/life.db${ext}" ]; then cp -a "data/life.db${ext}" "data/backups/life.db.pre-turso${ext}"; fi
                done
              fi
              echo "legacy SQLite snapshot: data/life.db -> data/backups/life.db.pre-turso"
            fi

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USER:-github}" --password-stdin
            fi

            export LIFE_IMAGE="${IMAGE}:${TAG}"
            echo "LIFE_IMAGE=$LIFE_IMAGE minted=$MINTED OPENCLAW_STATE_DIR=${OPENCLAW_STATE_DIR:-}"
            if [ "$OC" = "true" ]; then
              echo "openclaw config file=$(openclaw config file)"
              command -v openclaw >/dev/null
              openclaw config validate
            fi

            docker compose -f compose.yaml pull || true
            if [ "$MINTED" = "1" ]; then
              docker compose -f compose.yaml up -d --no-build --force-recreate
            else
              docker compose -f compose.yaml up -d --no-build
            fi
            if [ "$OC" = "true" ]; then
              docker compose -f compose.yaml run --rm skill-sync
            fi

            ok=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8787/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
                ok=1
                break
              fi
              sleep 4
            done
            if [ "$ok" != "1" ]; then
              echo "::error::lifeos-api did not become healthy within 120s"
              docker compose -f compose.yaml ps || true
              docker compose -f compose.yaml logs --no-color --tail=200 api || docker logs --tail=200 lifeos-api || true
              exit 1
            fi
            curl -fsS http://127.0.0.1:8787/actuator/info || true
            docker compose -f compose.yaml ps || true
            docker image inspect "$LIFE_IMAGE" --format 'deployed {{.RepoTags}} {{.Id}}' || true
            if [ "$OC" = "true" ]; then
              echo "waiting 60s for skills watcher after delete+recopy"
              sleep 60
              openclaw skills list
            fi
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/zoomzoomtnt/lifeos-ai
          DEPLOY_TAG: ${{ steps.resolve.outputs.tag }}
          # Not secret: a repo variable is enough (a secret of the same name also works).
          TURSO_DATABASE_URL: ${{ vars.TURSO_DATABASE_URL || secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          OPENCLAW_ENABLED: ${{ vars.OPENCLAW_ENABLED || 'true' }}
